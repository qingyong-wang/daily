<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="茶店库存">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>茶店库存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a working ledger — summary strip, filter bar, item rows with stock gauges, then the 出入库 log. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e8ece7; --line:#d5dcd5;
  --ink:#1b2420; --muted:#5d6b64; --accent:#2c6e58; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --ok:#2f7d4f; --warn:#a8620c; --warn-soft:#fbecd6; --bad:#b4372f; --bad-soft:#f7dedb;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --sunk:#222c27; --line:#33403a;
  --ink:#e6ece8; --muted:#9aa9a1; --accent:#6cc3a2; --accent-ink:#0c1a14; --accent-soft:#1f3a30;
  --ok:#6ccf93; --warn:#e9a54a; --warn-soft:#3a2c17; --bad:#f08a80; --bad-soft:#3d2120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --sunk:#222c27; --line:#33403a;
  --ink:#e6ece8; --muted:#9aa9a1; --accent:#6cc3a2; --accent-ink:#0c1a14; --accent-soft:#1f3a30;
  --ok:#6ccf93; --warn:#e9a54a; --warn-soft:#3a2c17; --bad:#f08a80; --bad-soft:#3d2120; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font-family:var(--display);font-size:28px;margin:0;letter-spacing:.04em;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;margin:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.05em}
.stat.alert b{color:var(--bad)} .stat.warn b{color:var(--warn)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.notice{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) 150px 190px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.hdr{font-size:12px;color:var(--muted);letter-spacing:.05em;background:var(--sunk);padding-block:8px}
.name{font-weight:500;cursor:pointer;min-width:0}
.name small{display:block;color:var(--muted);font-weight:400;font-size:12px;overflow-wrap:anywhere}
.qty{font-variant-numeric:tabular-nums;font-size:14px;min-width:0}
.qty b{font-size:17px}
.gauge{height:6px;background:var(--sunk);border-radius:3px;margin-top:5px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ok);border-radius:3px}
.st{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;justify-self:start}
.st.ok{color:var(--ok);background:var(--accent-soft)} .st.low{color:var(--warn);background:var(--warn-soft)} .st.out{color:var(--bad);background:var(--bad-soft)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.ops{display:flex;gap:6px}
.ops .btn{padding:6px 10px;font-size:13px}
@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .row.hdr{display:none}
  .row .qty{grid-column:1/2} .row .tags{grid-column:2/3;grid-row:1;justify-content:flex-end}
  .row .ops{grid-column:1/-1}
  .ops .btn{flex:1}
}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:9px 16px;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.log ul{list-style:none;margin:0;padding:0}
.log li:first-child{border-top:0}
.log time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.log .d{font-variant-numeric:tabular-nums;font-weight:500}
.d.in{color:var(--ok)} .d.out{color:var(--bad)} .d.chk{color:var(--muted)}
.log .note{color:var(--muted);font-size:12px}
@media (max-width:620px){.log li{grid-template-columns:minmax(0,1fr) auto}.log time{grid-column:1/-1}}

.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom,0px)}
@media (min-width:621px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:min(460px,100%);border-radius:14px 14px 0 0;padding:20px 20px 24px;display:grid;gap:14px;max-height:90vh;overflow:auto}
@media (min-width:621px){.sheet{border-radius:14px}}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;color:var(--ink);font-size:15px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.preview{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:30}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 16px;cursor:pointer;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.panel{display:grid;gap:20px}
.crow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.6fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.1fr);gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.crow:first-child{border-top:0}
.crow.hdr{font-size:12px;color:var(--muted);letter-spacing:.05em;background:var(--sunk);padding-block:8px}
.crow .cn{font-weight:500;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.crow .cn:hover{color:var(--accent)}
.pts{color:var(--accent);font-weight:700}
.sales li{grid-template-columns:110px minmax(0,1fr) auto auto}
.sales .amt{font-variant-numeric:tabular-nums;font-weight:500}
.sales .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px}
.sales .x:hover{color:var(--bad)}
@media (max-width:620px){
  .crow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .crow.hdr{display:none}
  .crow .c-sum{grid-column:2;grid-row:1;text-align:right}
  .crow .c-n,.crow .c-last{font-size:12px;color:var(--muted)}
  .crow .c-pts{grid-column:2;text-align:right}
  .sales li{grid-template-columns:minmax(0,1fr) auto auto}
}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 78px 76px 32px;gap:8px;align-items:center}
.line select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 6px;color:var(--ink);font-size:15px;min-width:0;width:100%}
.line input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;color:var(--ink);font-size:15px;min-width:0;width:100%}
.line .rm{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.line .rm:hover{color:var(--bad)}
.line .hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px;font-variant-numeric:tabular-nums}
.line .hint.warn{color:var(--warn)}
@media (max-width:620px){.crow .c-q{font-size:12px;color:var(--muted)}}
/* 云同步 */
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--ok)} .sync[data-s="busy"] i{background:var(--warn)} .sync[data-s="bad"] i{background:var(--bad)}
.cs-mask{position:fixed;inset:0;background:rgb(0 0 0/.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.cs-box{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;width:100%;max-width:360px;display:grid;gap:10px}
.cs-box h2{font-size:18px}
.cs-box p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.cs-box input{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cs-err{color:var(--bad);font-size:13px;min-height:1em}
.cs-btns{display:flex;gap:8px}.cs-btns .btn{flex:1;padding:10px}
.cs-skip{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;justify-self:center;padding:4px}
.cs-who{font-size:14px;word-break:break-all}
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <div><h1>茶店库存 · 客户</h1><p id="sub">正在读取库存…</p></div>
    <div class="actions">
      <button class="btn sync" id="csBtn" type="button" data-s="off" hidden><i></i><span>云同步</span></button>
      <button class="btn" id="exportBtn" type="button">导出表格</button>
      <button class="btn" id="backupBtn" type="button">备份</button>
      <button class="btn" id="restoreBtn" type="button">恢复备份</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      <button class="btn primary" id="addBtn" type="button">＋ 新增品项</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-inv" aria-selected="true" data-tab="inv" type="button">库存</button>
    <button class="tab" role="tab" id="t-cust" aria-selected="false" data-tab="cust" type="button">客户</button>
  </nav>
  <div class="panel" id="p-inv">
  <section class="stats" aria-label="库存概况">
    <div class="stat"><b id="sItems">–</b><span>品项</span></div>
    <div class="stat alert"><b id="sOut">–</b><span>缺货</span></div>
    <div class="stat warn"><b id="sLow">–</b><span>低于安全库存 / 临期</span></div>
    <div class="stat"><b id="sValue">–</b><span>库存估值（元）</span></div>
  </section>

  <div class="notice" id="exampleNote" hidden>
    <span>当前列表里有示例品项（标着“示例”），换成你店里的真实物料后可以一键清掉。</span>
    <button class="btn" id="clearEx" type="button">清除示例</button>
  </div>

  <section class="bar">
    <input class="search" id="q" type="search" placeholder="搜品名或供应商">
    <div class="chips" id="cats" role="group" aria-label="分类"></div>
  </section>

  <section class="list" id="list" aria-live="polite">
    <div class="empty"><p>库存数据加载中…</p></div>
  </section>

  <section style="display:grid;gap:10px">
    <h2>出入库记录</h2>
    <div class="log"><ul id="log"><li><span class="muted">还没有记录。点品项上的“入库”或“出库”就会记在这里。</span></li></ul></div>
  </section>
  </div>

  <div class="panel" id="p-cust" hidden>
    <section class="stats" aria-label="客户概况">
      <div class="stat"><b id="cCount">–</b><span>客户数</span></div>
      <div class="stat"><b id="cMonth">–</b><span>本月消费额（元）</span></div>
      <div class="stat"><b id="cOrders">–</b><span>本月消费笔数</span></div>
      <div class="stat"><b id="cPts">–</b><span>客户积分合计</span></div>
    </section>
    <section class="bar">
      <input class="search" id="cq" type="search" placeholder="搜客户名称或产品">
      <div class="chips" id="csort" role="group" aria-label="排序">
        <button class="chip" type="button" data-sort="last" aria-pressed="true">最近消费</button>
        <button class="chip" type="button" data-sort="sum" aria-pressed="false">累计金额</button>
        <button class="chip" type="button" data-sort="qty" aria-pressed="false">消费数量</button>
        <button class="chip" type="button" data-sort="pts" aria-pressed="false">积分</button>
      </div>
      <button class="btn" id="rateBtn" type="button">积分规则</button>
    </section>
    <section class="list" id="clist"></section>
    <section style="display:grid;gap:10px">
      <h2>消费记录</h2>
      <div class="log sales"><ul id="slog"></ul></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

  <p class="muted" id="footNote" style="font-size:12px;max-width:none;margin:-8px auto 24px;padding-inline:16px;text-align:center">数据只存在这台电脑的这个浏览器里。请一直用同一个浏览器打开，别清除浏览数据；每周点一次“备份”，备份文件存好就不怕丢。</p>
<script src="../supabase.js"></script>
<script>
const DEFAULT_CATS=["茶叶","奶/乳品","小料","糖浆果酱","水果","包材","其他"];
const UNITS=["克","斤","千克","包","袋","盒","罐","饼","瓶","桶","升","个","条","箱"];
const WEIGHT={"克":1,"斤":500,"千克":1000};
const isW=u=>u in WEIGHT;
const conv=(q,from,to)=>isW(from)&&isW(to)?q*WEIGHT[from]/WEIGHT[to]:q;
const unitChoices=u=>isW(u)?["克","斤","千克"]:[u];
const unitSel=(id,u,sel)=>`<select id="${id}" class="usel" aria-label="单位">${unitChoices(u).map(x=>`<option ${x===(sel||u)?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
const S={cats:DEFAULT_CATS.slice(),sales:[],rate:1,tab:"inv",csort:"last",cq:"",items:[],moves:[],cat:"全部",q:"",loaded:false,db:null,canWrite:true,updatedAt:0};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("zh-CN");
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function daysLeft(exp){if(!exp)return null;const d=new Date(exp+"T00:00:00");if(isNaN(d))return null;return Math.round((d-today())/864e5)}
function status(it){
  const q=num(it.qty),m=num(it.min);
  const s=q<=0?["out","缺货"]:(m>0&&q<=m?["low","偏低"]:["ok","充足"]);
  const dl=daysLeft(it.expiry);
  const exp=dl===null?null:dl<0?["out","已过期"]:dl<=3?["low",dl===0?"今天到期":dl+"天到期"]:null;
  return {s,exp};
}

function renderCats(){
  $("cats").innerHTML=["全部",...S.cats].map(c=>`<button class="chip" type="button" aria-pressed="${S.cat===c}" data-c="${esc(c)}">${esc(c)}</button>`).join("")+`<button class="chip" type="button" id="catMgr" style="border-style:dashed">分类管理</button>`;
}
function render(){
  const items=S.items;
  let out=0,low=0,val=0;
  for(const it of items){const {s,exp}=status(it);if(s[0]==="out")out++;else if(s[0]==="low"||exp)low++;val+=num(it.qty)*num(it.cost)}
  $("sItems").textContent=items.length;$("sOut").textContent=out;$("sLow").textContent=low;$("sValue").textContent=fmt(val);
  $("exampleNote").hidden=!items.some(i=>i.example);
  const q=S.q.trim().toLowerCase();
  const rank={out:0,low:1,ok:2};
  const vis=items.filter(i=>(S.cat==="全部"||i.cat===S.cat)&&(!q||(i.name+" "+(i.supplier||"")).toLowerCase().includes(q)))
    .sort((a,b)=>{const sa=status(a),sb=status(b);const ra=Math.min(rank[sa.s[0]],sa.exp?1:2),rb=Math.min(rank[sb.s[0]],sb.exp?1:2);return ra-rb||a.name.localeCompare(b.name,"zh")});
  const L=$("list");
  if(!S.loaded){return}
  if(!items.length){
    L.innerHTML=`<div class="empty"><p>还没有品项。先把店里的茶叶、奶、小料、杯子这些加进来，设好“安全库存”，低于它就会标黄提醒。</p><button class="btn primary" type="button" data-act="add">＋ 新增第一个品项</button></div>`;return}
  if(!vis.length){L.innerHTML=`<div class="empty"><p>这个筛选下没有品项。</p></div>`;return}
  L.innerHTML=`<div class="row hdr"><span>品项</span><span>库存 / 安全线</span><span>状态</span><span></span></div>`+vis.map(it=>{
    const {s,exp}=status(it);const q=num(it.qty),m=num(it.min);
    const pct=m>0?Math.min(100,q/(m*2)*100):(q>0?100:0);
    const col=s[0]==="out"?"var(--bad)":s[0]==="low"?"var(--warn)":"var(--ok)";
    const meta=[it.cat,it.supplier,it.cost?`¥${fmt(num(it.cost))}/${it.unit}`:"",it.example?"示例":""].filter(Boolean).join(" · ");
    return `<div class="row">
      <div class="name" data-act="edit" data-id="${it.id}" title="编辑">${esc(it.name)}<small>${esc(meta)}</small></div>
      <div class="qty"><b>${fmt(q)}</b> ${esc(it.unit)}${it.unit==="克"&&q>=500?` <span class="muted">≈${fmt(q/500)}斤</span>`:""} <span class="muted">/ ${m?fmt(m):"未设"}</span><div class="gauge"><i style="width:${pct}%;background:${col}"></i></div></div>
      <div class="tags"><span class="st ${s[0]}">${s[1]}</span>${exp?`<span class="st ${exp[0]}">${exp[1]}</span>`:""}</div>

function renderLog(){

  ul.innerHTML=S.moves.map(m=>{

async function delItem(it){try{delItemData(it.id);closeSheet();toast("已删除 "+it.name)}catch(e){writeErr(e)}}

function moveSheet(it,type){
  const cur=num(it.qty);
  openSheet(`<h2>${esc(it.name)}</h2>
  <div class="seg" role="group" aria-label="操作">${[["in","入库"],["out","出库"],["chk","盘点"]].map(([k,l])=>`<button type="button" data-t="${k}" aria-pressed="${k===type}">${l}</button>`).join("")}</div>
  <form id="mvForm" style="display:grid;gap:12px">
    <div class="field"><span id="amtLbl">数量</span><div style="display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px"><input id="m-amt" type="number" step="any" min="0" inputmode="decimal" required aria-labelledby="amtLbl">${unitSel("m-unit",it.unit)}</div></div>
    <label class="field">备注（选填）<input id="m-note" placeholder="如：供应商到货、报损、做活动"></label>
    <p class="preview" id="pv"></p>
    <div class="actions" style="justify-content:flex-end"><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit">确认</button></div>
  </form>`);
  let t=type;
  const amt=()=>conv(num($("m-amt").value),$("m-unit").value,it.unit);
  const upd=()=>{const a=amt();const u=$("m-unit").value;
    $("amtLbl").textContent=t==="chk"?"实际盘点数":t==="in"?"入库数量":"出库数量";
    const after=t==="in"?cur+a:t==="out"?cur-a:a;
    $("pv").textContent=(u!==it.unit&&num($("m-amt").value)?`${fmt(num($("m-amt").value))} ${u} = ${fmt(a)} ${it.unit}。`:"")+`当前 ${fmt(cur)} ${it.unit} → 之后 ${fmt(after)} ${it.unit}`+(after<0?"（会变成负数，请检查）":"");
  };
  $("sheet").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{t=b.dataset.t;$("sheet").querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()});
  $("m-amt").oninput=upd;$("m-unit").onchange=upd;upd();
  $("cancel").onclick=closeSheet;
  $("mvForm").onsubmit=async ev=>{ev.preventDefault();
    const a=amt();const u=$("m-unit").value;const now=S.items.find(i=>i.id===it.id);const base=num(now?now.qty:cur);
    const after=t==="in"?base+a:t==="out"?base-a:a;const delta=after-base;
    if(t!=="chk"&&!a)return;
    const note=[u!==it.unit?`${fmt(num($("m-amt").value))}${u}`:"",$("m-note").value.trim()].filter(Boolean).join(" · ");
    try{
      updItem(it.id,{qty:after,updated:Date.now()});
      addMove({itemId:it.id,itemName:it.name,unit:it.unit,type:t,delta,after,note,ts:Date.now()});
      closeSheet();toast(`${it.name}：现有 ${fmt(after)} ${it.unit}`)
    }catch(e){writeErr(e)}
  };
}
function catSheet(){
  const count=c=>S.items.filter(i=>i.cat===c).length;
  openSheet(`<h2>分类管理</h2>
  <p class="preview" style="margin:0">改名字会同步到这个分类下的所有品项；删除分类后，里面的品项会移到“其他”（没有“其他”就移到第一个分类）。</p>
  <form id="catForm" style="display:grid;gap:8px">
    <div id="catRows" style="display:grid;gap:8px"></div>
    <div class="actions"><input id="newCat" class="search" placeholder="新分类名称，如：花茶、茶具"><button class="btn" type="button" id="addCat">添加</button></div>
    <div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit">保存</button></div>
  </form>`);
  let rows=S.cats.map(c=>({orig:c,name:c,del:false}));
  const draw=()=>{$("catRows").innerHTML=rows.map((r,i)=>r.del?`<div class="actions" style="align-items:center"><s class="muted" style="flex:1">${esc(r.orig)}</s><button class="btn" type="button" data-undo="${i}">撤销删除</button></div>`:
    `<div class="actions" style="align-items:center"><input class="search" data-ci="${i}" id="ci${i}" value="${esc(r.name)}" aria-label="分类名称"><span class="muted" style="font-size:12px;min-width:48px">${r.orig?count(r.orig)+" 个品项":"新"}</span><button class="btn danger" type="button" data-del="${i}">删除</button></div>`).join("");
    $("catRows").querySelectorAll("[data-ci]").forEach(inp=>inp.oninput=()=>rows[inp.dataset.ci].name=inp.value);
    $("catRows").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const r=rows[b.dataset.del];if(!r.orig)rows.splice(b.dataset.del,1);else r.del=true;draw()});
    $("catRows").querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{rows[b.dataset.undo].del=false;draw()});};
  draw();
  $("addCat").onclick=()=>{const v=$("newCat").value.trim();if(!v)return;rows.push({orig:null,name:v,del:false});$("newCat").value="";draw()};
  $("newCat").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("addCat").click()}};
  $("cancel").onclick=closeSheet;
  $("catForm").onsubmit=ev=>{ev.preventDefault();
    const keep=rows.filter(r=>!r.del).map(r=>({...r,name:r.name.trim()}));
    if(!keep.length){toast("至少要留一个分类");return}
    if(keep.some(r=>!r.name)){toast("分类名称不能为空");return}
    const names=keep.map(r=>r.name);if(new Set(names).size!==names.length){toast("有重名的分类，请改一下");return}
    const fallback=names.includes("其他")?"其他":names[0];
    for(const r of keep)if(r.orig&&r.orig!==r.name)S.items.forEach(i=>{if(i.cat===r.orig)i.cat=r.name});
    let moved=0;for(const r of rows.filter(r=>r.del))S.items.forEach(i=>{if(i.cat===r.orig){i.cat=fallback;moved++}});
    S.cats=names;if(S.cat!=="全部"&&!names.includes(S.cat))S.cat="全部";
    persist();renderCats();render();closeSheet();toast("分类已保存"+(moved?`，${moved} 个品项移到了“${fallback}”`:""))};
}

/* ---------- customers ---------- */
function ymd(ts){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function hm(ts){const d=new Date(ts);return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function toLocalInput(ts){const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function saleLines(x){if(Array.isArray(x.lines))return x.lines;
  return String(x.products||"").split(/[,，、]/).map(t=>t.trim()).filter(Boolean).map(n=>({name:n,qty:null}))}
function linesText(lines){return lines.map(l=>l.qty==null?l.name:`${l.name}×${fmt(num(l.qty))}${l.unit||""}`).join("，")}
const lineBase=l=>l.base!=null?num(l.base):num(l.qty);
function saleQty(x){return saleLines(x).reduce((a,l)=>a+(l.qty==null?0:num(l.qty)),0)}
function customers(){
  const m=new Map();
  for(const x of S.sales){const k=x.customer;let c=m.get(k);if(!c){c={name:k,sum:0,n:0,qty:0,pts:0,last:0,products:new Map()};m.set(k,c)}
    c.pts+=num(x.points);if(x.type!=="redeem"){c.sum+=num(x.amount);c.n++;
      for(const l of saleLines(x)){const q=l.qty==null?1:(l.itemId?lineBase(l):num(l.qty));c.qty+=l.qty==null?0:num(l.qty);c.products.set(l.name,(c.products.get(l.name)||0)+q)}}
    c.last=Math.max(c.last,x.ts)}
  return [...m.values()];
}
function renderCust(){
  const cs=customers();const now=new Date();const mStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const month=S.sales.filter(x=>x.ts>=mStart&&x.type!=="redeem");
  $("cCount").textContent=cs.length;$("cMonth").textContent=fmt(month.reduce((a,x)=>a+num(x.amount),0));
  $("cOrders").textContent=month.length;$("cPts").textContent=fmt(cs.reduce((a,c)=>a+c.pts,0));
  const q=S.cq.trim().toLowerCase();
  const vis=cs.filter(c=>!q||c.name.toLowerCase().includes(q)||[...c.products.keys()].some(p=>p.toLowerCase().includes(q)))
    .sort((a,b)=>S.csort==="sum"?b.sum-a.sum:S.csort==="qty"?b.qty-a.qty:S.csort==="pts"?b.pts-a.pts:b.last-a.last);
  const L=$("clist");
  if(!cs.length){L.innerHTML=`<div class="empty"><p>还没有客户消费记录。客户买单后点“记一笔消费”，填上客户名称、买了什么、多少钱，积分会按规则自动算好。</p><button class="btn primary" type="button" data-sale="new">＋ 记一笔消费</button></div>`}
  else if(!vis.length){L.innerHTML=`<div class="empty"><p>没有找到匹配的客户。</p></div>`}
  else L.innerHTML=`<div class="crow hdr"><span>客户名称</span><span>累计消费</span><span>次数</span><span>消费数量</span><span>积分</span><span>最近消费</span></div>`+vis.map(c=>`<div class="crow">
    <span class="cn" data-cust="${esc(c.name)}">${esc(c.name)}</span>
    <span class="c-sum">¥${fmt(c.sum)}</span><span class="c-n">${c.n} 次</span><span class="c-q">${fmt(c.qty)}</span>
    <span class="c-pts"><span class="pts">${fmt(c.pts)}</span> 分</span><span class="c-last">${ymd(c.last)} ${hm(c.last)}</span></div>`).join("");
  const sl=q?S.sales.filter(x=>x.customer.toLowerCase().includes(q)||String(x.products||"").toLowerCase().includes(q)):S.sales;
  $("slog").innerHTML=sl.length?sl.slice(0,100).map(saleLi).join(""):`<li><span class="muted" style="grid-column:1/-1">还没有消费记录。</span></li>`;
  $("rateBtn").textContent=`积分规则：每 1 元 = ${fmt(S.rate)} 分`;
}
function saleLi(x){const red=x.type==="redeem";
  return `<li><time>${ymd(x.ts).slice(5).replace("-","/")} ${hm(x.ts)}</time>
  <span><b class="cn" data-cust="${esc(x.customer)}" style="cursor:pointer">${esc(x.customer)}</b> · ${esc(x.type==="redeem"?x.products:linesText(saleLines(x)))}${x.note?` <span class="note">${esc(x.note)}</span>`:""}</span>
  <span class="amt">${red?`<span class="d out">${fmt(num(x.points))} 分</span>`:`¥${fmt(num(x.amount))} <span class="pts" style="font-weight:400">+${fmt(num(x.points))}分</span>`}</span>
  <button class="x" type="button" data-delsale="${x.id}" title="删除这条记录">删除</button></li>`}
function sortSales(){S.sales.sort((a,b)=>b.ts-a.ts)}
function saveSales(){persist();renderCust()}

function csSignedIn(u){const same=CS.user&&CS.user.id===u.id;CS.user=u;csPaint();if(!same)csPull(true)}
function csInit(){if(!CS.on)return;$("csBtn").hidden=false;
  try{CS.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}catch(e){CS.on=false;$("csBtn").hidden=true;return}
  $("csBtn").onclick=()=>{if(!CS.ready)return;CS.user?csAccount():csOpen()};csPaint();
  CS.sb.auth.getSession().then(r=>{const s=r&&r.data&&r.data.session;CS.ready=true;if(s)csSignedIn(s.user);else{csPaint();
    let asked=false;try{asked=sessionStorage.getItem("tea-cs-asked")}catch(e){}if(!asked){try{sessionStorage.setItem("tea-cs-asked","1")}catch(e){}csOpen()}}},()=>{CS.ready=true;csPaint()});
  CS.sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){CS.user=null;csPaint()}});
  setInterval(()=>{if(!document.hidden&&CS.user&&!CS.busy)csPull()},60000);
  document.addEventListener("visibilitychange",()=>{if(!CS.user)return;if(document.hidden){if(CS.dirty)csPush()}else csPull()});
  window.addEventListener("online",()=>{if(CS.user)CS.dirty?csPush():csPull()})}

renderCats();
try{const raw=localStorage.getItem(KEY);if(raw){applyData(JSON.parse(raw))}else{examples();persist(true)}}
catch(e){toast("浏览器禁止了本地存储，数据无法保存")}
S.loaded=true;renderCats();
$("sub").textContent="点品名编辑 · 入库/出库/盘点自动记录 · "+where();
render();renderLog();renderCust();
try{if(localStorage.getItem(KEY+"-tab")==="cust")setTab("cust")}catch(e){}
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue){applyData(JSON.parse(e.newValue));rerender()}});
csInit();
</script>
