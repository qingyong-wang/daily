<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f3f5f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="效率台"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-512.png"><title>每日任务台</title><style id="css">
/* 布局思路：左边一张“日历牌”定住当天，右边是当天的清单；窄屏时上下堆叠 */
:root{
  --paper:#f3f5f2; --card:#ffffff; --ink:#1b2320; --muted:#66726d; --line:#dde3de;
  --red:#cf3d29; --red-ink:#ffffff; --green:#2c7a59; --soft:#eaeeea;
  --num:"Didot","Bodoni 72","Songti SC","STSong",Georgia,serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101413; --card:#191f1d; --ink:#e7ece9; --muted:#8d9994; --line:#2a322f;
    --red:#ee6a54; --red-ink:#1a0f0c; --green:#5dbb90; --soft:#222a27; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101413; --card:#191f1d; --ink:#e7ece9; --muted:#8d9994; --line:#2a322f;
  --red:#ee6a54; --red-ink:#1a0f0c; --green:#5dbb90; --soft:#222a27; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:20px}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.08em}
.tabs{display:flex;gap:6px}
.tab{padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px;background:var(--card)}
.tab:hover{color:var(--ink);border-color:var(--ink)}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 习惯备忘录 */
.nview{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:720px){.nview{grid-template-columns:1fr}}
.nside{display:flex;flex-direction:column;gap:12px;min-width:0}
.newnote{background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 14px;font-size:14px;text-align:center}
.newnote:hover{opacity:.88}
.nsearch{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 12px;outline:none;font-size:14px}
.nsearch:focus{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--card)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.nlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.nlist li{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--card)}
.nlist li:first-child{border-top:0}
.nlist li:hover,.nlist li.on{background:var(--soft)}
.nlist li.on{box-shadow:inset 3px 0 0 var(--red)}
.nlist li .grip{align-self:center;margin:0 0 0 6px;width:18px}
.nlist li.dragging{position:relative;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.nitem{display:block;flex:1;min-width:0;text-align:left;padding:10px 14px 10px 6px}
.ni-t{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ni-m{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-top:4px}
.ni-m .tag{margin-left:0}
.nempty{padding:18px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;text-align:center}
.neditor{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ne-title{border:0;background:none;outline:none;font-size:22px;font-weight:700;padding:2px 0;width:100%}
.ne-title::placeholder,.ne-tag::placeholder,.ne-body::placeholder{color:var(--muted);font-weight:400}
.ne-tagrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px}
.ne-tag{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13px;padding:3px 0}
.ne-body{border:0;background:none;outline:none;resize:none;font-size:15px;line-height:1.75;min-height:360px;width:100%;overflow:hidden}
.ne-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.ne-foot button{margin-left:auto;padding:5px 12px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;color:var(--ink)}
.ne-foot button:hover{border-color:var(--red);color:var(--red)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 8px;border-radius:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-s="ok"] i{background:var(--green)}
.status[data-s="wait"] i,.status[data-s="busy"] i{background:#d9a13a}
.status[data-s="bad"] i{background:var(--red)}

.grid{display:grid;grid-template-columns:270px 240px minmax(0,1fr);grid-template-areas:"plans side work";gap:24px;align-items:start}
.plans{grid-area:plans}.side{grid-area:side}.work{grid-area:work}
@media (max-width:1060px){.grid{grid-template-columns:240px minmax(0,1fr);grid-template-areas:"side work" "plans work"}}
@media (max-width:720px){.grid{grid-template-columns:1fr;grid-template-areas:"side" "work" "plans"}}

/* 计划栏 */
.plans{display:flex;flex-direction:column;gap:10px;min-width:0}
.plan{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plan-h{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;text-align:left}
.plan-h:hover{background:var(--soft)}
.caret{flex:none;width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.plan.open>.plan-h .caret{transform:rotate(90deg)}
.plan-t{font-weight:600;font-size:14px;white-space:nowrap}
.plan-p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan-b{border-top:1px solid var(--line)}
.plan .list{border:0;border-radius:0;background:none}
.plan .item{padding:6px 6px 6px 12px;font-size:14px;gap:8px}
.plan .ck{width:18px;height:18px;border-radius:5px}
.plan .done .ck::after{left:5px;top:1.5px;width:4px;height:9px}
.sub+.sub{border-top:1px solid var(--line)}
.sub-h{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px 9px 16px;text-align:left;font-size:13.5px;font-weight:600;background:var(--paper)}
.sub-h:hover{background:var(--soft)}
.sub.open .caret{transform:rotate(90deg)}
.sub-t{white-space:nowrap}
.sub-b{border-top:1px solid var(--line)}
.sub-b .item{padding-left:32px}
.sub-b .padd{padding-left:32px}
.padd{display:flex;align-items:center;gap:6px;padding:8px 10px 10px 12px}
.plan .list+.padd{border-top:1px solid var(--line)}
.padd input{flex:1;min-width:0;border:1px dashed var(--line);border-radius:7px;background:none;padding:6px 10px;outline:none;font-size:13.5px}
.padd input::placeholder{color:var(--muted)}
.padd input:focus{border-style:solid;border-color:var(--muted)}
.padd input:not(:placeholder-shown){border-style:solid;border-color:var(--red)}
.padd button{flex:none;font-size:12.5px;color:var(--muted);padding:5px 10px;border-radius:6px}
.padd button:hover{background:var(--soft);color:var(--ink)}
.padd:has(input:not(:placeholder-shown)) button{background:var(--ink);color:var(--paper)}

.side{display:flex;flex-direction:column;gap:14px}
.leaf{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;box-shadow:0 6px 0 -3px var(--card),0 6px 0 -2px var(--line)}
.band{background:var(--red);color:var(--red-ink);padding:9px 12px;font-size:13px;letter-spacing:.2em;position:relative}
.band::before,.band::after{content:"";position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--paper)}
.band::before{left:14px}.band::after{right:14px}
.num{font-family:var(--num);font-size:104px;line-height:1;color:var(--red);padding:14px 0 2px;font-variant-numeric:lining-nums}
.wk{font-size:15px;letter-spacing:.3em;padding-left:.3em}
.rel{font-size:12px;color:var(--muted);margin-top:2px}
.step{display:flex;justify-content:center;gap:6px;padding:12px}
.step button{min-width:34px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.step button:hover{background:var(--soft)}
.step button:disabled{opacity:.4;cursor:default}
.prog{border-top:1px dashed var(--line);padding:12px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:7px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.prog-row b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .25s}
.streak{font-size:12px;color:var(--muted)}
.tonotes{display:block;width:calc(100% - 32px);margin:0 16px 14px;padding:8px 0;border:1px solid var(--line);border-radius:7px;font-size:13px}
.tonotes:hover{border-color:var(--ink);background:var(--soft)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:7px;border:1px solid transparent;font-size:11px;color:var(--muted)}
.wd:hover{background:var(--soft)}
.wd b{font-size:14px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.wd.on{background:var(--card);border-color:var(--line)}
.wd.now b{color:var(--red);font-weight:700}
.wd em{width:16px;height:3px;border-radius:2px;background:var(--soft);overflow:hidden;display:block}
.wd em span{display:block;height:100%;background:var(--green)}

.tools{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.tools-h{font-size:12px;color:var(--muted);letter-spacing:.12em;padding:0 2px}
.tools-row{display:flex;gap:6px;flex-wrap:wrap}
.tools-row button{flex:1 1 auto;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:12.5px;white-space:nowrap}
.tools-row button:hover{border-color:var(--ink)}
.bk{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);line-height:1.5}
.bk-st{display:flex;align-items:baseline;gap:6px}
.bk-st i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted);transform:translateY(-1px)}
.bk-st[data-s="ok"] i{background:var(--green)}
.bk-st[data-s="need"] i,.bk-st[data-s="busy"] i{background:#d9a13a}
.bk-st[data-s="err"] i{background:var(--red)}
.bk-st b{color:var(--ink);font-weight:500}
.bk-row{display:flex;gap:6px;flex-wrap:wrap}
.bk-row button{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:12.5px;color:var(--ink)}
.bk-row button:hover{border-color:var(--ink)}
.bk-row button.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.work{display:flex;flex-direction:column;gap:18px;min-width:0}
.note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
.note button{margin-left:auto;padding:4px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--card);font-size:13px}
.note button:hover{border-color:var(--ink)}

.add{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.add input[type=text]{flex:1 1 200px;min-width:0;border:0;background:none;padding:8px;outline:none;font-size:15px}
.add input[type=text]::placeholder{color:var(--muted)}
.add:focus-within{border-color:var(--ink)}
.rep{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 6px;cursor:pointer;white-space:nowrap}
.rep input{accent-color:var(--red);width:15px;height:15px;margin:0}
.go{background:var(--ink);color:var(--paper);border-radius:7px;padding:8px 16px;font-size:14px}
.go:hover{opacity:.88}

.group{display:flex;flex-direction:column;gap:6px}
.gh{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.12em;padding:0 2px}
.gh span{letter-spacing:0;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.star{box-shadow:inset 3px 0 0 var(--red)}
.grip{flex:none;width:16px;height:28px;margin-left:-6px;margin-right:-4px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.4;cursor:grab;touch-action:none;font-size:13px;letter-spacing:-3px;user-select:none;-webkit-user-select:none}
.grip:hover{opacity:1}
.grip.none{visibility:hidden}
.item.dragging{background:var(--soft);position:relative;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.14)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.ck{flex:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:6px;position:relative;transition:background .15s,border-color .15s}
.ck:hover{border-color:var(--green)}
.done .ck{background:var(--green);border-color:var(--green)}
.done .ck::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;padding:2px 0;cursor:text}
.done .txt{color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:11px;line-height:17px;color:var(--muted);vertical-align:2px;white-space:nowrap}
.edit{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--red);background:none;padding:2px 0;outline:none}
.ops{display:flex;gap:2px;flex:none}
.op{width:30px;height:30px;border-radius:6px;color:var(--muted);font-size:15px;line-height:1;opacity:.55}
.op:hover,.op:focus-visible{opacity:1;background:var(--soft)}
.op.lit{color:var(--red);opacity:1}
.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;text-align:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:13px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{color:inherit;text-decoration:underline;font-size:13px}
/* 完成趋势 */
.trend{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tr-h{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.tr-t{font-weight:600;font-size:15px}
.tr-s{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tr-s b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-left:3px}
.tr-h .tabs{margin-left:auto}
.tr-h>.hb-fold{margin-left:auto}
.tr-h .tabs+.hb-fold{margin-left:0}
.tr-c{position:relative;height:200px;cursor:crosshair;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tr-c svg{display:block;overflow:visible}
.tr-grid{stroke:var(--line);stroke-width:1}
.tr-ax{fill:var(--muted);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
.tr-area{fill:var(--green);opacity:.12}
.tr-line{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tr-dot{fill:var(--card);stroke:var(--green);stroke-width:1.5}
.tr-dot.full{fill:var(--green)}
.tr-dot.on{stroke:var(--red);stroke-width:2.5}
.tr-guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tr-tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;line-height:1.4;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.tr-tip[hidden]{display:none}
/* 习惯打卡热力图 */
.habits{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hb-top{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.hb-top .tr-t{margin-right:auto}
.hb-leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.hb-leg i{width:11px;height:11px;border-radius:3px;background:var(--soft);display:inline-block}
.hb-leg i.y{background:var(--green)}
.hb-fold{font-size:12.5px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.hb-fold:hover{color:var(--ink);border-color:var(--ink)}
.hb{display:flex;flex-direction:column;gap:6px;min-width:0}
.hb+.hb{border-top:1px dashed var(--line);padding-top:14px}
.hb-h{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.hb-n{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.hb-n .tag{font-weight:400}
.hb-s{font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.hb-s b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin:0 2px}
.hb-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.hb-scroll svg{display:block}
.hb-c{fill:var(--soft);cursor:pointer}
.hb-c.x{opacity:.35;cursor:default}
.hb-c.y{fill:var(--green)}
.hb-c.now{stroke:var(--red);stroke-width:1.5}
.hb-c:not(.x):hover{stroke:var(--ink);stroke-width:1.5}
.hb-ax{fill:var(--muted);font-size:10px;font-family:var(--body)}
/* ---------- 手机端（720px 以下） ---------- */
.mnav,.hb-info{display:none}
body.is-m{padding-bottom:66px}
body.is-m.kb{padding-bottom:0}
.wrap.m{padding:14px 16px 28px;gap:14px}
.m-h{font-size:24px;font-weight:700;margin:6px 2px 2px;letter-spacing:.04em}
.mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.mnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;font-size:11px;color:var(--muted);-webkit-tap-highlight-color:transparent}
.mnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mnav button.on{color:var(--red);font-weight:600}
body.kb .mnav{display:none}
.mdate{display:flex;align-items:center;gap:10px}
.md-b{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1;color:var(--muted)}

    if(r.error)throw r.error;
    CS.base=at;
  }).catch(function(e){CS.dirty=true;CS.failed=true;console.warn('云同步失败',e)}).then(function(){

/* 从云端取最新的数据；云端更新就用云端的，本机更新就上传本机的 */
function csPull(manual){
  if(!CS.user||CS.pulling)return;
  if(CS.dirty&&!manual){csPush();return}
  CS.pulling=true; CS.busy=true; csPaint();
  CS.sb.from('boards').select('data,updated_at').eq('user_id',CS.user.id).maybeSingle().then(function(r){
    if(r.error)throw r.error;
    var row=r.data, mine=state.updatedAt||0;
    CS.busy=false; CS.failed=false;
    if(row&&row.data&&row.data.v===1&&row.updated_at>mine){
      var prev=JSON.stringify(state), first=CS.base<0, hadLocal=!state.sample&&mine>0;
      state=row.data; delete state.sample; normPlans(state); normNotes(state);
      if(!state.routines)state.routines=[]; if(!state.days)state.days={};
      try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
      CS.base=row.updated_at; CS.dirty=false;
      if(first&&hadLocal)toast('已换成云端的最新数据（本机旧数据可撤销恢复）',prev);
      render();
    }else if(!row||row.updated_at<mine){
      CS.base=row?row.updated_at:0;
      if(!state.sample){CS.dirty=true;csPush()}
    }else CS.base=row.updated_at;
  }).catch(function(e){CS.busy=false;CS.failed=true;console.warn('云同步读取失败',e)}).then(function(){CS.pulling=false;csPaint()});
}
function csSignOut(){

}

  if(/Password should be at least/i.test(m))return '密码至少要 6 位。';
  if(/valid email|invalid format|Unable to validate email/i.test(m))return '邮箱格式不对，请检查一下。';
  if(/Email not confirmed/i.test(m))return '这个邮箱还没确认：请去邮箱里点确认链接。';
  if(/rate limit|too many/i.test(m))return '试得太频繁了，请过几分钟再试。';

/* ---------- 自动备份：写进你选的文件夹（Chrome / Edge） ---------- */
var BK={supported:typeof window.showDirectoryPicker==='function'&&!!window.indexedDB&&!(window.claude&&window.claude.use),dir:null,name:'',status:'off',last:0,err:'',timer:0,busy:false,again:false,dirty:false};
try{BK.last=+(localStorage.getItem('xlt-bk-last')||0)}catch(e){}
function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open('xiaolvtai',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbDo(mode,fn){return idbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv',mode),q=fn(tx.objectStore('kv'));tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){rej(tx.error)}})})}
function idbGet(k){return idbDo('readonly',function(st){return st.get(k)})}
function idbSet(k,v){return idbDo('readwrite',function(st){return st.put(v,k)})}
function idbDel(k){return idbDo('readwrite',function(st){return st.delete(k)})}
function bkWhen(ms){if(!ms)return '';var d=new Date(ms);return (ds(d)===today()?'今天 ':(d.getMonth()+1)+'月'+d.getDate()+'日 ')+pad(d.getHours())+':'+pad(d.getMinutes())}
function bkHTML(){
  if(window.claude&&window.claude.use)return '<div class="bk-st" data-s="ok"><i></i><span>在线版的改动会自动保存，手机和电脑看到的是同一份。想留一份在本地，可以点“导出备份”。</span></div>';
  if(!BK.supported)return '<div class="bk-st" data-s="off"><i></i><span>自动备份需要用 Chrome 或 Edge 打开这个文件</span></div>';
  if(BK.status==='off')return '<div class="bk-st" data-s="off"><i></i><span>自动备份未开启。选一个文件夹，之后每次改动都会自动存一份。</span></div>'+
    '<div class="bk-row"><button class="main" data-act="bk-pick">设置自动备份</button></div>';
  var where='「<b>'+esc(BK.name)+'</b>」';
  if(BK.status==='need')return '<div class="bk-st" data-s="need"><i></i><span>自动备份暂停了：浏览器重新打开后，需要你允许一下才能继续写入'+where+'。</span></div>'+
    '<div class="bk-row"><button class="main" data-act="bk-resume">继续自动备份</button><button data-act="bk-pick">换个文件夹</button></div>';
  if(BK.status==='err')return '<div class="bk-st" data-s="err"><i></i><span>自动备份失败'+(BK.err?'：'+esc(BK.err):'')+'</span></div>'+
    '<div class="bk-row"><button class="main" data-act="bk-resume">重试</button><button data-act="bk-pick">换个文件夹</button></div>';
  return '<div class="bk-st" data-s="'+(BK.busy?'busy':'ok')+'"><i></i><span>自动备份已开启，存到'+where+(BK.last?'，最近一次 '+bkWhen(BK.last):'')+'</span></div>'+
    '<div class="bk-row"><button data-act="bk-pick">换个文件夹</button><button data-act="bk-off">关闭</button></div>';
}
function paintBK(){var el=document.getElementById('bk');if(el)el.innerHTML=bkHTML()}
function bkSchedule(ms){
  if(!BK.dir)return; BK.dirty=true;
  if(BK.status!=='ok')return;
  clearTimeout(BK.timer); BK.timer=setTimeout(bkWrite,ms==null?3000:ms);
}
async function bkWriteFile(dir,name,text){var fh=await dir.getFileHandle(name,{create:true});var w=await fh.createWritable();await w.write(text);await w.close()}
async function bkPrune(dir){
  var t=today(), done=''; try{done=localStorage.getItem('xlt-bk-prune')||''}catch(e){}
  if(done===t)return;
  var cut=addDays(t,-30), old=[];
  for await (var entry of dir.entries()){var m=/^效率台(?:备份|表格)-(\d{4}-\d\d-\d\d)\.(?:json|xlsx)$/.exec(entry[0]);if(m&&m[1]<cut)old.push(entry[0])}
  for(var i=0;i<old.length;i++){try{await dir.removeEntry(old[i])}catch(e){}}
  try{localStorage.setItem('xlt-bk-prune',t)}catch(e){}
}
async function bkWrite(){
  clearTimeout(BK.timer);
  if(!BK.dir||BK.status!=='ok')return;
  if(BK.busy){BK.again=true;return}
  BK.busy=true; BK.dirty=false; paintBK();
  try{
    var json=JSON.stringify(state,null,1);
    await bkWriteFile(BK.dir,'效率台备份-最新.json',json);
    await bkWriteFile(BK.dir,'效率台备份-'+today()+'.json',json);
    var xb=allXLSX().bytes;
    await bkWriteFile(BK.dir,'效率台表格-最新.xlsx',xb);
    await bkWriteFile(BK.dir,'效率台表格-'+today()+'.xlsx',xb);
    await bkPrune(BK.dir);
    BK.last=Date.now(); BK.err=''; try{localStorage.setItem('xlt-bk-last',BK.last)}catch(e){}
  }catch(e){
    BK.dirty=true;
    if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))BK.status='need';
    else{BK.status='err';BK.err=e&&e.name==='NotFoundError'?'找不到这个文件夹了，可能被移动或删除':String(e&&e.message||e)}
  }
  BK.busy=false; paintBK();
  if(BK.again){BK.again=false;bkSchedule(500)}
}
async function bkInit(){
  if(!BK.supported){paintBK();return}
  try{
    var h=await idbGet('backupDir');
    if(!h){BK.status='off';paintBK();return}
    BK.dir=h; BK.name=h.name;
    var p=await h.queryPermission({mode:'readwrite'});
    BK.status=p==='granted'?'ok':'need';
  }catch(e){BK.status='err';BK.err=String(e&&e.message||e)}
  paintBK();
  if(BK.status==='ok')bkSchedule(800);
}
async function bkPick(){
  try{
    var h=await window.showDirectoryPicker({id:'xlt-backup',mode:'readwrite',startIn:'documents'});
    await idbSet('backupDir',h);
    BK.dir=h; BK.name=h.name; BK.status='ok';
    await bkWrite();
    if(BK.status==='ok'){toast('自动备份已开启，备份存到「'+h.name+'」');render()}
  }catch(e){
    if(e&&e.name==='AbortError')return;
    toast('没能设置自动备份：'+String(e&&e.message||e));render();
  }
}
async function bkResume(){
  if(!BK.dir){bkPick();return}
  try{
    var p=await BK.dir.requestPermission({mode:'readwrite'});
    if(p==='granted'){BK.status='ok';await bkWrite()}else{BK.status='need'}
  }catch(e){BK.status='err';BK.err=String(e&&e.message||e)}
  paintBK();
}
async function bkOff(){
  try{await idbDel('backupDir')}catch(e){}
  clearTimeout(BK.timer); BK.dir=null; BK.name=''; BK.status='off';
  toast('自动备份已关闭，文件夹里已有的备份文件不会删除');render();
}

/* 当天的完整列表：每天重复的任务和当天任务合在一起 */
function dayItems(v){
  var D=dayR(v);
  var list=routinesOn(v).map(function(r){return {kind:'r',id:r.id,text:r.text,done:!!D.rdone[r.id],star:!!(D.rstar&&D.rstar[r.id])}})
    .concat(D.tasks.map(function(x){return {kind:'t',id:x.id,text:x.text,done:!!x.done,star:!!x.star}}));
  if(D.order){
    var pos={}; D.order.forEach(function(id,i){pos[id]=i});
    list=stableBy(list,function(x){return x.id in pos?pos[x.id]:1e6});
  }
  return stableBy(list,tKey);
}
function saveOrder(v,ids){
  dayW(v).order=ids;
  /* 每天重复的任务之间的先后，也带到以后的日子 */
  var objs=ids.map(findRoutine).filter(Boolean);
  var slots=objs.map(function(o){return state.routines.indexOf(o)}).sort(function(a,b){return a-b});
  slots.forEach(function(s,k){state.routines[s]=objs[k]});
}

  var tmp=list[i]; list[i]=list[j]; list[j]=tmp;

  ui.focus=false; commit();

function trendData(n){

function drawTrend(){
  var box=document.getElementById('trend-chart'); trendSel=-1; if(!box){trendGeo=null;return}
  var n=trendN(), data=trendData(n), t=today();
  var W=Math.max(260,box.clientWidth), H=200, L=38, R=10, T=12, B=26, iw=W-L-R, ih=H-T-B;
  function X(i){return L+(n>1?i*iw/(n-1):iw/2)}
  function Y(p){return T+ih*(1-p/100)}
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="最近 '+n+' 天每天的完成百分比">';
  [0,25,50,75,100].forEach(function(p){
    var y=Y(p).toFixed(1);
    s+='<line class="tr-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"'+(p%50?' stroke-dasharray="2 4"':'')+'/>';
    if(p%50===0)s+='<text class="tr-ax" x="'+(L-8)+'" y="'+y+'" dy="0.35em" text-anchor="end">'+p+'%</text>';
  });
  var step=Math.ceil(n/7);

    var dd=pd(data[i].d), lab=data[i].d===t?'今天':(dd.getMonth()+1)+'/'+dd.getDate();
    s+='<text class="tr-ax" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===n-1?'end':i===0?'start':'middle')+'">'+lab+'</text>';
  }

  var segs=[], cur=null;
  data.forEach(function(x,i){if(x.p===null){cur=null;return}if(!cur)segs.push(cur=[]);cur.push([X(i),Y(x.p)])});
  segs.forEach(function(sg){
    var line=sg.map(function(p,j){return (j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
    if(sg.length>1)s+='<path class="tr-area" d="'+line+'L'+sg[sg.length-1][0].toFixed(1)+' '+Y(0)+'L'+sg[0][0].toFixed(1)+' '+Y(0)+'Z"/>';
    s+='<path class="tr-line" d="'+line+'"/>';

  });

/* ---------- 习惯打卡：每个每日重复任务一张一年的方格日历（只读现有记录，不新增数据） ---------- */
function hbActive(r,d){return r.from<=d&&(!r.until||d<r.until)}
function hbDone(r,d){return !!dayR(d).rdone[r.id]}
function hbStats(r,start,t){
  var cur=0, d=t;
  if(hbActive(r,d)&&!hbDone(r,d))d=addDays(d,-1); /* 今天还没打卡不算断 */
  while(hbActive(r,d)&&hbDone(r,d)){cur++;d=addDays(d,-1)}
  var best=0, run=0, act=0, dn=0;
  for(d=start;d<=t;d=addDays(d,1)){
    if(!hbActive(r,d))continue;
    var ok=hbDone(r,d);
    if(ok){dn++;act++;run++;if(run>best)best=run}
    else{if(d!==t)act++;run=0}
  }
  return {cur:cur,best:best,rate:act?Math.round(dn/act*100):null};
}
function hbSVG(r,start,weeks,t){
  var C=isM()?15:11, G=3, P=C+G, L=20, T=16, s='';
  var w=L+weeks*P, h=T+7*P;
  s+='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(r.text)+' 一年打卡记录">';
  ['一','','三','','五','',''].forEach(function(lab,i){if(lab)s+='<text class="hb-ax" x="0" y="'+(T+i*P+C/2)+'" dy="0.35em">'+lab+'</text>'});
  var marks=[], lastM=-1;
  for(var k=0;k<weeks;k++){var mk=pd(addDays(start,k*7)).getMonth();if(mk!==lastM){marks.push([k,mk]);lastM=mk}}
  marks.forEach(function(mk,j){
    var nx=marks[j+1]?marks[j+1][0]:weeks; /* 离下一个月份太近就不写，免得挤在一起 */
    if(nx-mk[0]>=3)s+='<text class="hb-ax" x="'+(L+mk[0]*P)+'" y="10">'+(mk[1]+1)+'月</text>';
  });
  for(var wk=0;wk<weeks;wk++){
    var ws=addDays(start,wk*7);
    for(var i=0;i<7;i++){
      var d=addDays(ws,i); if(d>t)break;
      var on=hbActive(r,d), ok=on&&hbDone(r,d), dd=pd(d);
      var tip=(dd.getMonth()+1)+'月'+dd.getDate()+'日 周'+WD[dd.getDay()]+' · '+(!on?'未设这个习惯':ok?'已打卡':'没打卡');
      s+='<rect class="hb-c'+(on?(ok?' y':''):' x')+(d===t?' now':'')+'" x="'+(L+wk*P)+'" y="'+(T+i*P)+'" width="'+C+'" height="'+C+'" rx="2.5"'+
         (on?' data-act="hb-go" data-d="'+d+'" data-r="'+esc(r.id)+'"':'')+'><title>'+tip+'</title></rect>';
    }
  }
  return s+'</svg>';
}
function habitsHTML(){
  var open=fold.habits!==false, t=today();
  var h='<section class="habits" aria-label="习惯打卡"><div class="hb-top"><span class="tr-t">习惯打卡</span>'+
    (open?'<span class="hb-leg"><i></i>没打卡<i class="y"></i>已打卡</span>':'')+
    '<button class="hb-fold" data-act="hb-fold" aria-expanded="'+open+'">'+(open?'收起':'展开')+'</button></div>';
  if(!open)return h+'</section>';
  var start=weekStart(addDays(t,-364)), weeks=Math.round((pd(weekStart(t))-pd(start))/864e5/7)+1;
  var rs=state.routines.filter(function(r){return r.from<=t&&(!r.until||r.until>start)});
  rs=stableBy(rs,function(r){return hbActive(r,t)?0:1});
  if(!rs.length)return h+'<div class="empty">还没有每天重复的任务。添加任务时勾选“每天重复”，这里就会出现它的打卡记录。</div></section>';
  rs.forEach(function(r){
    var st=hbStats(r,start,t), ended=!hbActive(r,t);
    h+='<div class="hb"><div class="hb-h"><span class="hb-n">'+esc(r.text)+(ended?'<span class="tag">已停止</span>':'')+'</span>'+
       '<span class="hb-s"><span>'+(ended?'':'当前连续<b>'+st.cur+'</b>天')+'</span><span>最长连续<b>'+st.best+'</b>天</span><span>一年完成率<b>'+(st.rate===null?'—':st.rate+'%')+'</b></span></span></div>'+
       '<div class="hb-scroll">'+hbSVG(r,start,weeks,t)+'</div><div class="hb-info" id="hbi-'+esc(r.id)+'">点格子看当天情况</div></div>';
  });
  return h+'</section>';
}

    n[tid==='note-title'?'title':tid==='note-tag'?'tag':'body']=ev.target.value;
    n.updated=Date.now();
    if(tid==='note-body')autoGrow(ev.target);
    var tm=document.getElementById('note-time'); if(tm)tm.textContent='创建 '+fmtTime(n.created)+' · 更新 '+fmtTime(n.updated);
    document.getElementById('note-list').innerHTML=noteListHTML();
    saveQuiet(); return;
  }
  if(ev.target.id==='new-task'){ui.draft=ev.target.value;saveUI();if(dirty&&artifact)schedule(2500)}
  else if(ev.target.classList.contains('padd-in')){ui.pdraft[ev.target.dataset.pk]=ev.target.value;saveUI()}
});
root.addEventListener('change',function(ev){
  if(ev.target.id==='note-tag'){var cz=document.getElementById('n-chips');if(cz)cz.innerHTML=chipsHTML();return}
  if(ev.target.id==='import-file'){var f=ev.target.files&&ev.target.files[0];if(f)importJSON(f);return}if(ev.target.id==='repeat'){ui.repeat=ev.target.checked;saveUI()}});
/* 手机：左右滑动切换日期；打字时收起底部导航，免得被键盘顶上来挡住 */
var sw=null;
function isField(el){return el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!/^(checkbox|radio|button|submit|file)$/.test(el.type)}
root.addEventListener('touchstart',function(ev){
  sw=null;
  if(!isM()||curM()!=='today'||drag||ev.touches.length!==1)return;
  var tg=ev.target;
  if(!tg.closest('#m-swipe,.mdate,.mprog')||tg.closest('.grip,input,textarea,.edit'))return;
  sw={x:ev.touches[0].clientX,y:ev.touches[0].clientY};
},{passive:true});
root.addEventListener('touchend',function(ev){
  if(!sw||drag||editing)return;
  var p=ev.changedTouches[0], dx=p.clientX-sw.x, dy=p.clientY-sw.y; sw=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
  ui.view=addDays(ui.view,dx<0?1:-1); ui.focus=false; render();
  var w=document.querySelector('.wrap.m'); if(w)w.classList.add(dx<0?'sl':'sr');
},{passive:true});
if(MQ){var mqf=function(){if(!drag)render()};if(MQ.addEventListener)MQ.addEventListener('change',mqf);else if(MQ.addListener)MQ.addListener(mqf)}
root.addEventListener('focusin',function(ev){
  if(ev.target.id==='new-task')ui.focus=true;
  if(isField(ev.target))document.body.classList.add('kb');
});
root.addEventListener('focusout',function(ev){
  setTimeout(function(){if(!isField(document.activeElement))document.body.classList.remove('kb')},60);
  if(ev.target.id==='new-task')ui.focus=false;
  if(ev.target.id==='edit-input')saveEdit();

});
root.addEventListener('keydown',function(ev){
  if(ev.target.id!=='edit-input')return;
  if(ev.key==='Enter'){ev.preventDefault();saveEdit()}
  else if(ev.key==='Escape'){editing=null;render()}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(dirty&&artifact)flush(true);if(BK.dirty&&BK.status==='ok')bkWrite();if(CS.dirty)csPush()}
  else{if(CS.user)csPull();if(ui.day!==today()){if(ui.view===ui.day)ui.view=today();render()}}
});

/* ---------- 启动 ---------- */
function start(data){
  var saved=readUI(), k;
  for(k in saved)ui[k]=saved[k];
  for(k in (data||{}))ui[k]=data[k];
  if(!ui.pdraft||typeof ui.pdraft!=='object')ui.pdraft={};
  ui.pfocus=null; ui.nfocus=null; if(ui.tab!=='notes')ui.tab='tasks';
  if(ui.day!==today()||!/^\d{4}-\d\d-\d\d$/.test(ui.view||''))ui.view=today();
  render();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return ui});
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});

bkInit(); csInit();
window.addEventListener('pagehide',function(){if(BK.dirty&&BK.status==='ok')bkWrite();if(CS.dirty)csPush()});
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(a){artifact=a||null;paintStatus()},function(){artifact=null;paintStatus()});
}else{artifact=null;paintStatus()}
})();
</script></body></html>
